name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: node --test tests/rendered-html.test.mjs

      - name: Stage Pages output
        # The vinext build leaves a Workers deploy redirect in .wrangler/deploy;
        # remove it so wrangler uses wrangler.jsonc (Pages) instead.
        run: |
          node export/stage-pages.mjs dist-pages
          rm -rf .wrangler/deploy

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name va-contracting --branch main --commit-hash ${{ github.sha }} --commit-dirty=true
